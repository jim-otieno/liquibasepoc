# GitHub Actions CI: runs on every push and pull request.
# Proves on a real PostgreSQL that every phase applies in order, the backfill
# gate holds, and the reversible phases roll back.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r tools/phase-linter/requirements.txt
      - run: python tools/phase-linter/phase_lint.py db/changelog/db.changelog-master.yaml
      - run: python -m pytest -q tools/phase-linter

  compatibility-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Pin Docker API version for Testcontainers
        # Docker Engine 29 on the runners rejects API versions below 1.44,
        # which older docker-java clients request by default.
        run: |
          echo "api.version=1.44" > ~/.docker-java.properties
          docker version --format 'Docker server {{.Server.Version}}, API {{.Server.APIVersion}} (min {{.Server.MinAPIVersion}})'
      - name: Build + CompatibilityMatrixTest
        working-directory: app
        # Maven Central rate-limits shared runners (HTTP 429). The resolver
        # retries 429/503 with back-off; the outer loop retries the whole
        # build if resolution still fails.
        env:
          MAVEN_ARGS: >-
            -B -ntp
            -Daether.connector.http.retryHandler.count=6
            -Daether.connector.http.retryHandler.interval=10000
            -Daether.connector.http.retryHandler.serviceUnavailable=429,503
        run: |
          for attempt in 1 2 3; do
            if mvn verify; then exit 0; fi
            # Retry only when the failure was dependency resolution, not a test.
            if [ -d target/surefire-reports ]; then exit 1; fi
            echo "::warning::Maven attempt $attempt failed before tests ran; retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          exit 1
      - name: Publish test failures as annotations
        if: failure()
        working-directory: app
        run: |
          shopt -s nullglob
          for f in target/surefire-reports/TEST-*.xml; do
            grep -oE '<(failure|error) [^>]*message="[^"]{0,400}' "$f" | sed -E 's/.*message="/::error title=Test failure::/' || true
          done

  phases-on-postgres:
    runs-on: ubuntu-latest
    needs: phase-linter
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: poc, POSTGRES_USER: poc, POSTGRES_PASSWORD: poc }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U poc" --health-interval 5s --health-retries 20
    env:
      LB_URL: jdbc:postgresql://localhost:5432/poc
      LB_NETWORK: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "psycopg[binary]>=3.1"
      - run: chmod +x scripts/*.sh
      - name: Baseline + seed
        run: |
          scripts/deploy-phase.sh baseline ci
          python experiments/seed_data.py --rows 50000
      - name: Expand, then prove rollback works
        run: |
          scripts/deploy-phase.sh expand ci
          scripts/liquibase.sh rollback --tag=pre-expand-ci
          scripts/deploy-phase.sh expand ci2
      - name: Migrate gate refuses before backfill
        run: |
          if scripts/deploy-phase.sh migrate ci; then echo "migrate gate should have halted"; exit 1; fi
      - name: Backfill, migrate, harden, contract
        run: |
          python experiments/backfill.py --batch 5000 --sleep-ms 0
          scripts/deploy-phase.sh migrate ci
          python experiments/verify_integrity.py
          scripts/deploy-phase.sh harden ci
          scripts/deploy-phase.sh contract ci
          python experiments/verify_integrity.py --after-contract
      - run: scripts/liquibase.sh history
