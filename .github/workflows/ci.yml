# GitHub Actions CI: runs on every push and pull request.
# Proves on a real PostgreSQL that every phase applies in order, the backfill
# gate holds, and the reversible phases roll back.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r tools/phase-linter/requirements.txt
      - run: python tools/phase-linter/phase_lint.py db/changelog/db.changelog-master.yaml
      - run: python -m pytest -q tools/phase-linter

  compatibility-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Pin Docker API version for Testcontainers
        # Docker Engine 29 on the runners rejects API versions below 1.44,
        # which older docker-java clients request by default.
        run: |
          echo "api.version=1.44" > ~/.docker-java.properties
          docker version --format 'Docker server {{.Server.Version}}, API {{.Server.APIVersion}} (min {{.Server.MinAPIVersion}})'
      - name: Build + CompatibilityMatrixTest
        working-directory: app
        # Maven Central rate-limits shared runners (HTTP 429). The resolver
        # retries 429/503 with back-off; the outer loop retries the whole
        # build if resolution still fails.
        env:
          MAVEN_ARGS: >-
            -B -ntp
            -Daether.connector.http.retryHandler.count=6
            -Daether.connector.http.retryHandler.interval=10000
            -Daether.connector.http.retryHandler.serviceUnavailable=429,503
        run: |
          for attempt in 1 2 3; do
            if mvn verify; then exit 0; fi
            # Retry only when the failure was dependency resolution, not a test.
            if [ -d target/surefire-reports ]; then exit 1; fi
            echo "::warning::Maven attempt $attempt failed before tests ran; retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          exit 1
      - name: Publish test failures as annotations
        if: failure()
        working-directory: app
        run: |
          shopt -s nullglob
          for f in target/surefire-reports/TEST-*.xml; do
            grep -oE '<(failure|error) [^>]*message="[^"]{0,400}' "$f" | sed -E 's/.*message="/::error title=Test failure::/' || true
          done

  # Runs every phase against the shared RDS PostgreSQL instance (infra/aws).
  # Each run: assume an AWS role via OIDC (main branch only - never PRs or forks),
  # open port 5432 to this runner's IP, create a throwaway database, run the
  # phases, then drop the database and close the port.
  phases-on-rds:
    runs-on: ubuntu-latest
    needs: phase-linter
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # OIDC token for AWS
      contents: read
    concurrency:
      group: rds-ci     # one run at a time touches the security group
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      DB_INSTANCE: liquibase-poc
      RUN_DB: ci_${{ github.run_id }}_${{ github.run_attempt }}
      LB_NETWORK: host
      DB_SSLMODE: require
      DB_KIND: postgresql
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "psycopg[binary]>=3.1"
      - run: chmod +x scripts/*.sh
      - name: Check AWS_ROLE_ARN repository variable
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error title=AWS_ROLE_ARN not visible::No repository variable AWS_ROLE_ARN is visible to this job. Add it under Settings > Secrets and variables > Actions > Variables > Repository variables (not Secrets, not an Environment)."
            exit 1
          fi
          case "$ROLE" in
            arn:aws:iam::*:role/*) echo "::notice title=AWS_ROLE_ARN::variable visible, role $(echo "$ROLE" | sed 's#.*:role/##')" ;;
            *) echo "::error title=AWS_ROLE_ARN malformed::The variable is set but is not an IAM role ARN (length ${#ROLE}, starts with '${ROLE:0:12}')."; exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Look up RDS, read password, open port to this runner
        run: |
          read -r HOST SECRET SG USER < <(aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE" \
            --query 'DBInstances[0].[Endpoint.Address,MasterUserSecret.SecretArn,VpcSecurityGroups[0].VpcSecurityGroupId,MasterUsername]' \
            --output text)
          PASS="$(aws secretsmanager get-secret-value --secret-id "$SECRET" --query SecretString --output text | jq -r .password)"
          echo "::add-mask::$PASS"
          IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          {
            echo "DB_HOST=$HOST"; echo "DB_USER=$USER"; echo "DB_PASSWORD=$PASS"
            echo "LB_USER=$USER"; echo "LB_PASSWORD=$PASS"
            echo "LB_URL=jdbc:postgresql://$HOST:5432/$RUN_DB?sslmode=require"
            echo "SG_ID=$SG"; echo "RUNNER_IP=$IP"
          } >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG" \
            --ip-permissions "IpProtocol=tcp,FromPort=5432,ToPort=5432,IpRanges=[{CidrIp=$IP/32,Description=gha-$RUN_DB}]" >/dev/null
          echo "opened 5432 to $IP for $RUN_DB"

      - name: Create run database
        run: DB_NAME=postgres python experiments/ci_database.py create "$RUN_DB"

      - name: Baseline + seed
        env: { DB_NAME: '${{ env.RUN_DB }}' }
        run: |
          scripts/deploy-phase.sh baseline ci
          python experiments/seed_data.py --rows 50000
      - name: Expand, then prove rollback works
        run: |
          scripts/deploy-phase.sh expand ci
          scripts/liquibase.sh rollback --tag=pre-expand-ci
          scripts/deploy-phase.sh expand ci2
      - name: Migrate gate refuses before backfill
        run: |
          if scripts/deploy-phase.sh migrate ci; then echo "migrate gate should have halted"; exit 1; fi
      - name: Backfill, migrate, harden, contract
        env: { DB_NAME: '${{ env.RUN_DB }}' }
        run: |
          python experiments/backfill.py --batch 5000 --sleep-ms 0
          scripts/deploy-phase.sh migrate ci
          python experiments/verify_integrity.py
          scripts/deploy-phase.sh harden ci
          scripts/deploy-phase.sh contract ci
          python experiments/verify_integrity.py --after-contract
      - run: scripts/liquibase.sh history

      - name: Drop run database
        if: always() && env.SG_ID != ''
        run: DB_NAME=postgres python experiments/ci_database.py drop "$RUN_DB" || true
      - name: Close port
        if: always() && env.SG_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=5432,ToPort=5432,IpRanges=[{CidrIp=$RUNNER_IP/32}]" >/dev/null
          echo "closed 5432 for $RUNNER_IP"
