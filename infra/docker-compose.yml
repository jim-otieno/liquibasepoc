# Local PoC stack.
#   docker compose -f infra/docker-compose.yml up -d                    # PostgreSQL stack
#   docker compose -f infra/docker-compose.yml --profile oracle up -d   # + Oracle 23ai Free
#
# Two app instances sit behind nginx so a rolling deploy really overlaps
# application versions N-1 and N.
name: liquibase-poc

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: poc
    # log_lock_waits: every wait longer than deadlock_timeout (1s) is logged - a second lock measure.
    command: ["postgres", "-c", "log_lock_waits=on", "-c", "max_connections=300"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc -d poc"]
      interval: 5s
      retries: 20

  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: poc_admin
      APP_USER: poc
      APP_USER_PASSWORD: poc
    ports: ["1521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 60

  app-a: &app
    build: ../app
    environment:
      APP_SCHEMA_MODE: ${APP_A_MODE:-OLD_ONLY}
      DB_URL: ${APP_DB_URL:-jdbc:postgresql://postgres:5432/poc}
      DB_USER: poc
      DB_PASSWORD: poc
    ports: ["8081:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      retries: 30

  app-b:
    <<: *app
    environment:
      APP_SCHEMA_MODE: ${APP_B_MODE:-OLD_ONLY}
      DB_URL: ${APP_DB_URL:-jdbc:postgresql://postgres:5432/poc}
      DB_USER: poc
      DB_PASSWORD: poc
    ports: ["8082:8080"]

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:8080"]
    depends_on: [app-a, app-b]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["3000:3000"]
    depends_on: [prometheus]
