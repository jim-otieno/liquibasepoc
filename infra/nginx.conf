events {}

http {
  upstream customer_service {
    server app-a:8080 max_fails=1 fail_timeout=2s;
    server app-b:8080 max_fails=1 fail_timeout=2s;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://customer_service;
      # While one instance restarts, retry idempotent requests on the other.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
  }
}
